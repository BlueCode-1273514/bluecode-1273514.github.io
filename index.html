<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlueCode 的主页</title>
    <meta name="robots" content="noindex">
    <link rel="icon" href="picture/picture.webp" type="image/webp">
    <link rel="apple-touch-icon" href="picture/picture.webp">
    <style>
        :root {
            --bg-blue-1: #9fc7ff;
            --bg-blue-2: #b8dcff;
            --bg-base: #a8cfff;
            --card-bg: #ffffff;
            --card-left-bg: #fafcff;
            --card-border: rgba(255, 255, 255, 0.8);
            --divider: #eef3f9;
            --text-main: #2c3e50;
            --text-sub: #5a6a7a;
            --text-light: #7f8c8d;
            --text-muted: #95a5a6;
            --bio-border: #e8e8e8;
            --link-color: #3498db;
            --btn-bg: #4facfe;
            --btn-hover: #2f9bfe;
            --quote-bg: #f8faff;
            --quote-border: #4facfe;
            --quote-label: #4facfe;
            --quote-text: #34495e;
            --shadow-card: 0 12px 32px rgba(31, 64, 120, 0.16), 0 2px 8px rgba(31, 64, 120, 0.08);
            --shadow-card-hover: 0 20px 48px rgba(31, 64, 120, 0.22), 0 4px 12px rgba(31, 64, 120, 0.1);
        }

        body.dark-mode {
            --bg-blue-1: #1e3a6e;
            --bg-blue-2: #2a4a80;
            --bg-base: #1e3a6e;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--bg-base);
            padding: 24px;
            position: relative;
            overflow: hidden;
            transition: background 0.5s ease;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background:
                radial-gradient(circle at 15% 10%, rgba(255, 255, 255, 0.95), transparent 42%),
                radial-gradient(circle at 30% 25%, rgba(255, 255, 255, 0.55), transparent 38%),
                radial-gradient(circle at 88% 90%, rgba(255, 255, 255, 0.45), transparent 40%),
                linear-gradient(135deg, var(--bg-blue-1), var(--bg-blue-2));
            pointer-events: none;
            z-index: 0;
            transition: background 0.5s ease;
        }

        body.dark-mode::before {
            background:
                radial-gradient(circle at 15% 10%, rgba(100, 150, 220, 0.25), transparent 42%),
                radial-gradient(circle at 30% 25%, rgba(80, 130, 200, 0.15), transparent 38%),
                radial-gradient(circle at 88% 90%, rgba(80, 130, 200, 0.15), transparent 40%),
                linear-gradient(135deg, var(--bg-blue-1), var(--bg-blue-2));
        }

        body .pink-overlay {
            position: fixed;
            inset: 0;
            background:
                radial-gradient(circle at 15% 10%, rgba(255, 255, 255, 0.95), transparent 42%),
                radial-gradient(circle at 30% 25%, rgba(255, 255, 255, 0.55), transparent 38%),
                radial-gradient(circle at 88% 90%, rgba(255, 255, 255, 0.45), transparent 40%),
                linear-gradient(135deg, #ffb6d9, #ffd6e8);
            pointer-events: none;
            z-index: 0;
            opacity: 0;
            transition: opacity 0.8s ease;
        }

        body.pink-mode .pink-overlay { opacity: 1; }

        body.dark-mode .pink-overlay {
            background:
                radial-gradient(circle at 15% 10%, rgba(255, 180, 220, 0.12), transparent 42%),
                radial-gradient(circle at 30% 25%, rgba(255, 150, 200, 0.08), transparent 38%),
                radial-gradient(circle at 88% 90%, rgba(255, 150, 200, 0.08), transparent 40%),
                linear-gradient(135deg, #4a2f3e, #5a3548);
        }

        body::after {
            content: "";
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.12) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.12) 1px, transparent 1px);
            background-size: 36px 36px;
            pointer-events: none;
            z-index: 0;
            -webkit-mask-image: radial-gradient(circle at 50% 50%, #000 55%, transparent 100%);
            mask-image: radial-gradient(circle at 50% 50%, #000 55%, transparent 100%);
            transition: background-image 0.5s ease;
        }

        body.dark-mode::after {
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
        }

        /* 卡片上方的一级标题欢迎语 */
        .page-welcome {
            position: relative;
            z-index: 1;
            text-align: center;
            font-size: 42px;
            font-weight: 400;
            color: #4facfe;
            margin-bottom: 24px;
            letter-spacing: 2px;
            line-height: 1.4;
            transition: color 0.8s ease;
        }

        body.dark-mode .page-welcome {
            color: #6dbfe8;
        }

        body.pink-mode .page-welcome {
            color: #e84393;
        }

        .card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 720px;
            background: var(--card-bg);
            border-radius: 6px;
            overflow: hidden;
            box-shadow: var(--shadow-card);
            border: 1px solid var(--card-border);
            display: flex;
            transition: transform 0.3s ease, box-shadow 0.5s ease, background 0.5s ease, border-color 0.5s ease;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-card-hover);
        }

        .card-left {
            width: 200px;
            flex-shrink: 0;
            background: var(--card-left-bg);
            border-right: 1px solid var(--divider);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 28px 16px;
            transition: background 0.5s ease, border-color 0.5s ease;
        }

        .avatar {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            border: 4px solid #fff;
            object-fit: cover;
            margin-bottom: 14px;
            box-shadow: 0 6px 18px rgba(102, 126, 234, 0.3);
            cursor: pointer;
            user-select: none;
            transition: transform 0.2s ease;
        }

        .avatar:hover {
            transform: scale(1.05);
        }

        .card-left .name {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 4px;
        }

        .card-left .title {
            font-size: 12px;
            color: var(--text-light);
            text-align: center;
        }

        .card-right {
            flex: 1;
            padding: 26px 30px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-width: 0;
        }

        .bio {
            font-size: 13px;
            color: var(--text-sub);
            line-height: 1.7;
            margin-bottom: 18px;
            padding-bottom: 16px;
            border-bottom: 1px dashed var(--bio-border);
            transition: color 0.5s ease, border-color 0.5s ease;
        }

        .contact-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px 20px;
            margin-bottom: 20px;
        }

        .contact-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            color: var(--text-sub);
            min-width: 0;
            transition: color 0.5s ease;
        }

        .contact-item .label {
            color: var(--text-muted);
            flex-shrink: 0;
            transition: color 0.5s ease;
        }

        .contact-item a,
        .contact-item span {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .contact-item a {
            color: var(--link-color);
            text-decoration: none;
            transition: color 0.8s ease;
        }

        .contact-item a:hover { text-decoration: underline; }

        .card-actions {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
        }

        .btn {
            padding: 10px 22px;
            border-radius: 4px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.8s ease;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            border: none;
        }

        .btn-primary {
            background: var(--btn-bg);
            color: #fff;
            box-shadow: 0 4px 12px rgba(79, 172, 254, 0.35);
        }

        .btn-primary:hover {
            background: var(--btn-hover);
            box-shadow: 0 6px 18px rgba(79, 172, 254, 0.5);
            transform: translateY(-1px);
        }

        .music-player {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
        }

        .music-player .music-label {
            font-size: 13px;
            color: var(--text-muted);
            flex-shrink: 0;
        }

        .music-player audio {
            flex: 1;
            height: 36px;
            border-radius: 4px;
            outline: none;
            min-width: 0;
        }

        .daily-quote {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 12px 14px;
            margin-bottom: 18px;
            background: var(--quote-bg);
            border-left: 3px solid var(--quote-border);
            border-radius: 4px;
            font-size: 13px;
            line-height: 1.7;
            transition: background 0.8s ease, border-color 0.8s ease;
        }

        .daily-quote .quote-label {
            color: var(--quote-label);
            font-weight: 600;
            flex-shrink: 0;
            white-space: nowrap;
            transition: color 0.8s ease;
        }

        .daily-quote .quote-text {
            color: var(--quote-text);
            flex: 1;
            min-width: 0;
        }

        body.pink-mode .daily-quote {
            background: #fff0f0;
            border-left-color: #e74c3c;
        }

        body.pink-mode .daily-quote .quote-label { color: #e74c3c; }
        body.pink-mode .contact-item a { color: #e74c3c; }

        body.pink-mode .btn-primary {
            background: #e74c3c;
            box-shadow: 0 4px 12px rgba(231, 76, 60, 0.4);
        }

        body.pink-mode .btn-primary:hover {
            background: #d63031;
            box-shadow: 0 6px 18px rgba(231, 76, 60, 0.55);
        }

        @media (max-width: 620px) {
            .card {
                flex-direction: column;
                max-width: 380px;
                border-radius: 6px;
            }
            .card-left {
                width: 100%;
                padding: 24px 16px;
                border-right: none;
                border-bottom: 1px solid var(--divider);
            }
            .card-right { padding: 22px 22px; }
            .contact-grid { grid-template-columns: 1fr; }
            .card-actions { justify-content: center; }
            .page-welcome { font-size: 28px; }
        }
    </style>
</head>
<body>

    <div class="pink-overlay"></div>

    <script>
        var SUPABASE_URL = 'https://nnekudnbordbvikklfci.supabase.co';
        var SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5uZWt1ZG5ib3JkYnZpa2tsZmNpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA0MDU3MTMsImV4cCI6MjEwNTk4MTcxM30.1dlBtek7UJLCSlhCqXFN0Gox7AF58h05TCbO_ePH2qc';

        // ===== 双击头像切换深色模式 =====
        var THEME_KEY = 'bluecode_theme';
        var avatar = document.getElementById('avatar');

        function applyTheme(isDark) {
            if (isDark) {
                document.body.classList.add('dark-mode');
            } else {
                document.body.classList.remove('dark-mode');
            }
        }

        avatar.addEventListener('dblclick', function() {
            var isDark = !document.body.classList.contains('dark-mode');
            localStorage.setItem(THEME_KEY, isDark ? 'dark' : 'light');
            applyTheme(isDark);
        });

        var savedTheme = localStorage.getItem(THEME_KEY);
        applyTheme(savedTheme === 'dark');

        // ===== 音乐彩蛋 =====
        var music = document.getElementById('bgMusic');

        music.addEventListener('play', function() {
            document.body.classList.add('pink-mode');
        });

        music.addEventListener('pause', function() {
            document.body.classList.remove('pink-mode');
        });

        music.addEventListener('ended', function() {
            document.body.classList.remove('pink-mode');
        });

        // ===== 每日一句 =====
        async function loadDailyQuote() {
            var quoteEl = document.getElementById('quoteText');

            var today = new Date();
            var dateKey = today.getFullYear() + '-' + (today.getMonth() + 1) + '-' + today.getDate();
            var cacheKey = 'daily_quote_' + dateKey;

            var cached = localStorage.getItem(cacheKey);
            if (cached) {
                quoteEl.textContent = cached;
                return;
            }

            try {
                var response = await fetch(
                    SUPABASE_URL + '/functions/v1/hitokoto',
                    {
                        method: 'GET',
                        headers: {
                            'Authorization': 'Bearer ' + SUPABASE_KEY
                        }
                    }
                );

                if (!response.ok) {
                    quoteEl.textContent = '今天也要加油鸭！';
                    return;
                }

                var data = await response.json();

                if (!data.hitokoto) {
                    quoteEl.textContent = '今天也要加油鸭！';
                    return;
                }

                var author = data.from_who || data.from || '佚名';
                var text = data.hitokoto + ' —— ' + author;

                quoteEl.textContent = text;
                localStorage.setItem(cacheKey, text);
            } catch (error) {
                quoteEl.textContent = '今天也要加油鸭！';
            }
        }

        loadDailyQuote();
    </script>
